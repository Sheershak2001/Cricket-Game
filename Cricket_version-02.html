<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1> Bat Ball Stump </h1>

  <button class="choice-button" onclick="
    let userChoice = 'Bat';
    let computerChoice = getComputerChoiced();
    let resultMessage = getResult(userChoice, computerChoice);
    let finalResult = showResult(userChoice, computerChoice, resultMessage);
  ">Bat</button>
  <button class="choice-button" onclick="
    userChoice = 'Ball';
    computerChoice = getComputerChoiced();
    resultMessage = getResult(userChoice, computerChoice);
    finalResult = showResult(userChoice, computerChoice, resultMessage);
  ">Ball</button>
  <button class="choice-button" onclick="
    userChoice = 'Stump';
    computerChoice = getComputerChoiced();
    resultMessage = getResult(userChoice, computerChoice);
    finalResult = showResult(userChoice, computerChoice, resultMessage);
  ">Stump</button>

  <script>
    function getComputerChoiced() {
      let randomNumber = Math.random() * 3;

      if(randomNumber > 0 && randomNumber <= 1){
        return 'Bat';
      }else if(randomNumber > 1 && randomNumber <= 2){
        return 'Ball';
      }else{
        return 'Stump';
      }
    }

    function getResult(userMove, computerMove) {
      if(userMove == 'Bat'){
        if(computerMove === 'Bat'){
          return `it's tie.`;
        }
        else if(computerMove === 'Ball'){
          return 'User won.'
        }
        if(computerMove === 'Stump'){
          return 'Computer has won.'
        }
      }
      else if(userMove === 'Ball'){
        if(computerMove === 'Bat'){
          return 'Computer has won.';
        }
        else if(computerMove === 'Ball'){
          return `it's tie.`;
        }
        if(computerMove === 'Stump'){
          return 'User won.'
        }
      }
      else if(userMove === 'Stump'){
        if(computerMove === 'Bat'){
          return 'User won.';
        }
        else if(computerMove === 'Ball'){
          return 'Computer has won.';
        }
        if(computerMove === 'Stump'){
          return `it's tie.`;
        }
      }
    }

    function showResult(userChoice, computerChoice, resultMessage) {
      console.log(`user choice is ${userChoice}. Computer choice is ${computerChoice}. and ${resultMessage}`);
    }
  </script>
</body>
</html>
